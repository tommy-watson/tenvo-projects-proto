<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intention to hold &mdash; Wharparilla Estate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0F2E1D;
  --head:#1A2E24;
  --ink:#2F3A33;
  --ink-2:#5E6F63;
  --ink-3:#8A978E;
  --accent:#5DA05E;
  --surface:#F8F6EE;
  --surface-2:#EFEAD9;
  --card:#FFFFFF;
  --hairline:rgba(31,74,46,.1);
  --hairline-2:rgba(31,74,46,.22);
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --shadow:0 4px 14px rgba(15,46,29,.06),0 1px 2px rgba(15,46,29,.04);
  --ease:cubic-bezier(.22,1,.36,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--font);background:var(--surface);color:var(--ink);line-height:1.5;font-size:15px;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
.page{min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 28px;background:#fff;border-bottom:1px solid var(--hairline)}
.topbar .brand{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:1.1rem;color:var(--head);letter-spacing:-.01em}
.topbar .brand span{color:var(--ink-3);font-size:.78rem;font-weight:400;margin-left:10px;letter-spacing:.06em;text-transform:uppercase}
.topbar .powered{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.topbar .powered b{color:var(--navy);font-weight:700;letter-spacing:0;text-transform:none;margin-left:4px;font-size:.84rem}
.wrap{max-width:720px;margin:0 auto;padding:48px 24px 80px;width:100%;flex:1}
.eyebrow{font-size:.64rem;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:12px}
h1{font-family:'Fraunces','Playfair Display',Georgia,serif;font-weight:500;font-size:2rem;color:var(--head);letter-spacing:-.02em;margin-bottom:12px;line-height:1.15}
.lead{color:var(--ink-2);font-size:1rem;line-height:1.6;margin-bottom:32px}
.card{background:var(--card);border:1px solid var(--hairline);border-radius:16px;box-shadow:var(--shadow);padding:24px 26px;margin-bottom:18px}
.card h2{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:1.15rem;color:var(--head);letter-spacing:-.01em;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--hairline)}
.detail{display:grid;grid-template-columns:140px 1fr;gap:10px 20px;align-items:baseline;padding:5px 0}
.detail dt{font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin:0}
.detail dd{margin:0;color:var(--head);font-weight:500;font-size:.92rem}
.detail dd b{font-weight:600}
.ack-list{display:flex;flex-direction:column;gap:12px}
.ack-item{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;background:var(--surface);border:1px solid var(--hairline);border-radius:12px;cursor:pointer;transition:.2s var(--ease)}
.ack-item:hover{border-color:var(--accent)}
.ack-item input{margin-top:2px;accent-color:var(--accent);width:18px;height:18px;flex-shrink:0;cursor:pointer}
.ack-item span{font-size:.9rem;color:var(--ink);line-height:1.5}
.ack-item span b{color:var(--head);font-weight:600}
.sig-field{margin-top:18px}
.sig-field label{display:block;font-family:var(--font);font-size:.74rem;letter-spacing:0;font-weight:600;color:var(--ink);margin-bottom:6px}
.sig-field label .req{color:#B45309;margin-left:3px}
.sig-field input{width:100%;font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:1.4rem;color:var(--head);background:#fff;border:none;border-bottom:2px solid var(--hairline-2);padding:10px 2px 8px;font-style:italic;transition:.2s var(--ease)}
.sig-field input:focus{outline:none;border-bottom-color:var(--accent)}
.sig-hint{font-size:.78rem;color:var(--ink-3);margin-top:6px}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.btn-submit{background:var(--navy);color:#fff;border:none;font-weight:600;padding:13px 30px;font-size:.94rem;border-radius:100px;cursor:pointer;transition:.2s var(--ease);box-shadow:0 8px 22px -6px rgba(31,74,46,.4);font-family:var(--font)}
.btn-submit:hover{background:var(--accent)}
.btn-submit:disabled{opacity:.5;cursor:default;background:var(--ink-3);box-shadow:none}
.state-done{text-align:center;padding:60px 20px 40px}
.state-done .tick{width:72px;height:72px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 24px}
.state-done .tick svg{width:36px;height:36px}
.state-done h1{margin-bottom:12px}
.state-done p{color:var(--ink-2);max-width:460px;margin:0 auto 8px}
.state-done p b{color:var(--head);font-weight:600}
.state-err{text-align:center;padding:60px 20px 40px}
.state-err h1{color:#8A3F07}
.state-err p{color:var(--ink-2);max-width:460px;margin:0 auto}
.footer{padding:20px 28px;background:#fff;border-top:1px solid var(--hairline);text-align:center;font-size:.78rem;color:var(--ink-3)}
.footer b{color:var(--navy);font-weight:700;letter-spacing:0}
@media (max-width:600px){
  h1{font-size:1.5rem}
  .wrap{padding:32px 18px 60px}
  .card{padding:20px}
  .detail{grid-template-columns:1fr;gap:4px 0}
  .detail dd{font-size:1rem}
}
</style>
</head>
<body>
<script src="wparBlocks.js"></script>
<div class="page">
  <header class="topbar">
    <div class="brand">Wharparilla Estate <span>Chris Smith &amp; Associates</span></div>
    <div class="powered">Powered by <b>Tenvo</b></div>
  </header>
  <main class="wrap">
    <div id="root">Loading&hellip;</div>
  </main>
  <footer class="footer">
    This intention-to-hold form is sent on behalf of Chris Smith &amp; Associates &middot; <b>Powered by Tenvo</b>
  </footer>
</div>
<script>
(function(){
  const WB = window.wparBlocks;
  const root = document.getElementById('root');
  const params = new URLSearchParams(location.search);
  const token = params.get('token');

  function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function fmtDate(ts){ return ts? new Date(ts).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'}):'—'; }

  function renderInvalid(reason){
    root.innerHTML = `
      <div class="state-err card">
        <h1>Link isn't valid</h1>
        <p>${escapeHtml(reason||"We couldn't find a matching hold for this link. It may have been cancelled, or the link may have been copied incorrectly. Reach out to the agent who sent it to you.")}</p>
      </div>`;
  }

  function renderDone(blockKey, record){
    const [stage, num] = blockKey.split('-');
    const p = record.hold.purchasers[0] || {};
    const f = record.hold.intentionForm || {};
    root.innerHTML = `
      <div class="state-done">
        <div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></div>
        <div class="eyebrow">Intention received</div>
        <h1>Thank you, ${escapeHtml(f.signatureName || p.name || '')}</h1>
        <p>Your intention to hold <b>Lot ${escapeHtml(num)}, Stage ${escapeHtml(stage)}</b> at Wharparilla Estate was received on <b>${fmtDate(f.signedAt)}</b>.</p>
        <p>The sales team will be in touch shortly to confirm next steps, including deposit and solicitor instructions.</p>
      </div>`;
  }

  function renderForm(blockKey, record){
    const [stage, num] = blockKey.split('-');
    const p = record.hold.purchasers[0] || {};
    const f = record.hold.intentionForm || {};
    root.innerHTML = `
      <div class="eyebrow">Intention to hold</div>
      <h1>Confirm your interest in Lot ${escapeHtml(num)}, Stage ${escapeHtml(stage)}</h1>
      <p class="lead">You've been sent this form because an agent has placed a hold on this block on your behalf. Review the details below and sign to formalise the hold. This is not a contract &mdash; a hold reserves the block while contracts are being prepared.</p>

      <div class="card">
        <h2>Block</h2>
        <dl class="detail">
          <dt>Lot</dt><dd><b>Lot ${escapeHtml(num)}, Stage ${escapeHtml(stage)}</b></dd>
          <dt>Estate</dt><dd>Wharparilla Estate</dd>
          <dt>Hold placed</dt><dd>${fmtDate(record.hold.placedAt)}</dd>
        </dl>
      </div>

      <div class="card">
        <h2>Purchaser</h2>
        <dl class="detail">
          <dt>Full name</dt><dd>${escapeHtml(p.name||'')}</dd>
          <dt>Phone</dt><dd>${escapeHtml(p.phone||'')}</dd>
          <dt>Email</dt><dd>${escapeHtml(p.email||'')}</dd>
        </dl>
      </div>

      <div class="card">
        <h2>Acknowledgements</h2>
        <div class="ack-list">
          <label class="ack-item"><input type="checkbox" data-ack="not-contract"><span>I understand that this <b>intention to hold is not a sale contract</b>. The block is reserved on good faith while the agent prepares the contract of sale.</span></label>
          <label class="ack-item"><input type="checkbox" data-ack="info-correct"><span>The <b>purchaser details above are correct</b>. If anything needs to change (including adding joint purchasers), I'll let the agent know before contracts are prepared.</span></label>
          <label class="ack-item"><input type="checkbox" data-ack="agent-contact"><span>I'm happy for the sales team at Chris Smith &amp; Associates to contact me about next steps including deposit, finance and solicitor instructions.</span></label>
        </div>
        <div class="sig-field">
          <label>Sign by typing your full name<span class="req">*</span></label>
          <input id="sigName" type="text" placeholder="Full name" autocomplete="name" value="${escapeHtml(p.name||'')}">
          <div class="sig-hint">Typing your name here acts as your electronic signature on this intention-to-hold.</div>
        </div>
        <div class="actions">
          <button type="button" class="btn-submit" id="submitBtn" disabled>Sign &amp; send</button>
        </div>
      </div>`;

    const checks = root.querySelectorAll('input[type=checkbox][data-ack]');
    const sig = document.getElementById('sigName');
    const btn = document.getElementById('submitBtn');
    function sync(){
      const allAck = [...checks].every(c=>c.checked);
      const hasSig = sig.value.trim().length>=2;
      btn.disabled = !(allAck && hasSig);
    }
    checks.forEach(c=>c.addEventListener('change',sync));
    sig.addEventListener('input',sync);
    sync();
    btn.addEventListener('click',()=>{
      btn.disabled = true;
      const acknowledgements = {};
      checks.forEach(c=>{ acknowledgements[c.dataset.ack]=true; });
      const r = WB.signIntentionForm(token, { signatureName: sig.value, acknowledgements });
      if(r.ok){
        // Re-read the record so the "done" screen has signedAt + signatureName populated.
        const now = WB.findByFormToken(token);
        if(now) renderDone(now.key, now.record);
      } else {
        renderInvalid();
      }
    });
  }

  if(!token){ renderInvalid('No token on the link.'); return; }
  const match = WB.findByFormToken(token);
  if(!match){ renderInvalid(); return; }
  const f = match.record.hold?.intentionForm;
  if(f?.signedAt) renderDone(match.key, match.record);
  else renderForm(match.key, match.record);
})();
</script>
</body>
</html>
